[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"  # v6.3.1: 原值 setuptools.backends._legacy:_Backend 在 setuptools<68 中不存在

[project]
name = "inkweaver-cli"
version = "7.0.0"
description = "InkWeaver-CLI 小说知识库与写作辅助工具"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "mcp>=1.9,<2.0",
]

[project.scripts]
inkweaver = "main:app_entry"
