[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inkweaver-cli"
version = "5.2.0"
description = "InkWeaver-CLI 小说知识库与写作辅助工具"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
inkweaver = "main:app_entry"
